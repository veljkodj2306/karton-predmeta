name: CI

on:
  push:
    branches:
      - main
      - automatizacija
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: karton_predmeta
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Preuzimanje koda
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Podesavanje Java 21 okruzenja
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Build i testiranje
        env:
          TEST_DB_PASSWORD: root
        run: bash mvnw --batch-mode clean verify

      - name: SonarQube analiza
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: bash mvnw --batch-mode org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=veljkodj2306_karton-predmeta

      - name: Cuvanje JAR fajla
        uses: actions/upload-artifact@v7
        with:
          name: karton-predmeta-jar
          path: target/karton-predmeta-*.jar
